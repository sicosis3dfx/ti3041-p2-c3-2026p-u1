{% extends 'contactos/base.html' %}
{% block title %}Eliminar contacto | Mis Contactos{% endblock %}
{% block content %}
<div class="panel" style="max-width: 540px;">
  <div class="panel-header">
    <div class="panel-avatar" style="background: linear-gradient(135deg, #ef4444, #f43f5e); box-shadow: 0 8px 20px rgba(239, 68, 68, 0.3);">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
        <line x1="12" y1="9" x2="12" y2="13"></line>
        <line x1="12" y1="17" x2="12.01" y2="17"></line>
      </svg>
    </div>
    <div>
      <h1>¿Eliminar a {{ contacto.nombre }}?</h1>
      <p class="subtitle">Esta acción es permanente y no se puede deshacer.</p>
    </div>
  </div>

  <form method="post">
    {% csrf_token %}
    <div class="actions">
      <button class="button danger" type="submit">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="3 6 5 6 21 6"></polyline>
          <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
        </svg>
        Sí, eliminar
      </button>
      <a class="button secondary" href="{% url 'contacto_detail' contacto.pk %}">Cancelar</a>
    </div>
  </form>
</div>
{% endblock %}
