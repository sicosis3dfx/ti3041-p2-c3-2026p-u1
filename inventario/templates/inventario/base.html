{% load static %}
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Mis Contactos{% endblock %}</title>
  <style>
    :root { --primary: #6c5ce7; --dark: #24243e; --muted: #74748b; --bg: #f5f6fb; }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--dark); background: var(--bg); font: 16px/1.5 system-ui, -apple-system, sans-serif; }
    nav { background: linear-gradient(115deg, #4834d4, #6c5ce7); color: white; }
    .nav-inner, main { width: min(1050px, calc(100% - 32px)); margin: auto; }
    .nav-inner { display: flex; align-items: center; justify-content: space-between; padding: 18px 0; }
    .brand { color: white; font-size: 1.25rem; font-weight: 800; text-decoration: none; }
    nav a { color: white; text-decoration: none; margin-left: 22px; }
    main { padding: 42px 0 70px; }
    h1 { margin: 0 0 8px; font-size: clamp(1.8rem, 4vw, 2.5rem); }
    .subtitle { color: var(--muted); margin-top: 0; }
    .toolbar { display: flex; gap: 12px; flex-wrap: wrap; margin: 28px 0; }
    input { width: 100%; padding: 12px 14px; border: 1px solid #dfe1ed; border-radius: 10px; font: inherit; }
    .search { flex: 1 1 280px; display: flex; gap: 8px; }
    button, .button { border: 0; border-radius: 10px; padding: 12px 18px; background: var(--primary); color: white; cursor: pointer; font-weight: 700; text-decoration: none; display: inline-block; }
    .button.secondary { background: #e9e8ff; color: var(--primary); }
    .button.danger { background: #e05252; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 18px; }
    .card, .panel { background: white; border-radius: 16px; padding: 22px; box-shadow: 0 8px 24px #30307d0d; }
    .card h2 { margin: 0 0 10px; font-size: 1.15rem; }
    .card h2 a { color: var(--dark); text-decoration: none; }
    .contact-data { color: var(--muted); margin: 8px 0; overflow-wrap: anywhere; }
    .actions { margin-top: 18px; display: flex; gap: 8px; }
    .form-row { margin-bottom: 18px; } label { display: block; font-weight: 700; margin-bottom: 6px; }
    .errorlist { color: #c0392b; padding-left: 20px; }
    .empty { text-align: center; padding: 45px; color: var(--muted); }
    @media (max-width: 500px) { .nav-inner { align-items: flex-start; flex-direction: column; gap: 10px; } nav a { margin: 0 18px 0 0; } }
  </style>
</head>
<body>
  <nav><div class="nav-inner">
    <a class="brand" href="{% url 'contacto_list' %}">♡ Mis Contactos</a>
    <div><a href="{% url 'contacto_list' %}">Contactos</a><a href="{% url 'contacto_create' %}">+ Agregar</a></div>
  </div></nav>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
