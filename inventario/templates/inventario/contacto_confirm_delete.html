{% extends 'inventario/base.html' %}
{% block title %}Eliminar contacto | Mis Contactos{% endblock %}
{% block content %}
<div class="panel"><h1>¿Eliminar a {{ contacto.nombre }}?</h1><p class="subtitle">Esta acción no se puede deshacer.</p>
<form method="post">{% csrf_token %}<button class="button danger" type="submit">Sí, eliminar</button><a class="button secondary" href="{% url 'contacto_detail' contacto.pk %}">Cancelar</a></form></div>
{% endblock %}
